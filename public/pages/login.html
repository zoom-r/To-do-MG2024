<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"> -->
    <link href="../css/login.css" rel="stylesheet">
    <link href="../bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <title>Влизане</title>
</head>
<body>
    <section class="vh-100">
    <div class="mask d-flex align-items-center h-100 gradient-custom-3">
      <div class="container h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
          <div class="col-12 col-md-9 col-lg-7 col-xl-6">
            <div class="card" style="border-radius: 15px;">
              <div class="card-body p-5">
                <h2 class="text-uppercase text-center mb-5">Влизане в профил</h2>
  
                <form>
  
                  <div data-mdb-input-init class="form-outline mb-4">
                    <label class="form-label" for="username_input">Потребителско име</label>
                    <input type="text" id="username_input" class="form-control form-control-lg" />                  
                  </div>
  
                  <div data-mdb-input-init class="form-outline mb-4">
                    <label class="form-label" for="password_input">Парола</label>
                    <input type="password" id="password_input" class="form-control form-control-lg" />                    
                  </div>

                  <div class="d-flex justify-content-center">
                    <button type="button"
                      data-mdb-button-init data-mdb-ripple-init class="btn btn-success btn-block btn-lg gradient-custom-4 text-body ">Вход</button>
                  </div>
  
                  <p class="text-center text-muted mt-5 mb-0">Нямате профил? <a href="/register"
                      class="fw-bold text-body"><u>Регистрация</u></a></p>
  
                </form>
  
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script> -->
  <script src="../bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
